name: Build Unsigned IPA

# 没有 Mac 也能打包 IPA：把本仓库推到 GitHub 后，手动触发（或 push main）即可。
# 产物为未签名 IPA，下载后用小白签 PRO 签名安装。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          if command -v bundle >/dev/null 2>&1 && [ -f ../Gemfile ]; then
            bundle install
            bundle exec pod install
          else
            pod install
          fi

      - name: Archive iOS app (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/LxMusicPlayer.xcworkspace \
            -scheme LxMusicPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LxMusicPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/LxMusicPlayer.xcarchive/Products/Applications/LxMusicPlayer.app build/ipa/Payload/
          cd build/ipa
          zip -qr LxMusicPlayer-unsigned.ipa Payload
          cd ../..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LxMusicPlayer-unsigned-ipa
          path: build/ipa/LxMusicPlayer-unsigned.ipa
          if-no-files-found: error
