name: Build Unsigned IPA

# 没有 Mac 也能打包 IPA：把本仓库推到 GitHub 后，手动触发（或 push main）即可。
# 产物为未签名 IPA，下载后用小白签 PRO 签名安装。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: |
          # 官方源在 runner 上偶发超时/缓存损坏，先清缓存，再重试 + 国内镜像兜底
          npm cache clean --force 2>/dev/null || true
          npm ci --no-audit --no-fund \
            || npm ci --no-audit --no-fund --registry=https://registry.npmmirror.com \
            || npm install --no-audit --no-fund \
            || npm install --no-audit --no-fund --registry=https://registry.npmmirror.com

      - name: Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: |
          ruby -v
          bundle -v
          # RN 0.87 需要 Gemfile 锁定的 CocoaPods/Xcodeproj 组合；bundler-cache 已装，这里再兜底一次
          bundle check || bundle install --retry 3 --jobs 2
          cd ios
          pod install || pod install --repo-update
        shell: bash

      - name: Archive iOS app (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/LxMusicPlayer.xcworkspace \
            -scheme LxMusicPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LxMusicPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/LxMusicPlayer.xcarchive/Products/Applications/LxMusicPlayer.app build/ipa/Payload/
          cd build/ipa
          zip -qr LxMusicPlayer-unsigned.ipa Payload
          cd ../..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LxMusicPlayer-unsigned-ipa
          path: build/ipa/LxMusicPlayer-unsigned.ipa
          if-no-files-found: error

      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-logs
          path: |
            /tmp/bundle-*.log
            ios/Podfile.lock
          if-no-files-found: ignore
